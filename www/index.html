<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#144e82" />
  <title>Restock Radar</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="topbar">
      <h1><span class="dot"></span>Restock Radar</h1>
      <div class="topbar-row">
        <div class="mode-toggle" id="modeToggle">
          <button data-mode="retail" class="active">Retail / Grocery</button>
          <button data-mode="restaurant">Restaurant</button>
        </div>
        <button class="settings-btn" id="settingsBtn" title="Settings" aria-label="Settings">⚙️</button>
      </div>
    </div>
    <div id="screen"></div>
    <div class="bottom-nav" id="bottomNav"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
